name: .NET Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest # Pode alterar para windows-latest ou macos-latest se precisar

    steps:
    # 1. Baixa o código do repositório para o runner
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Configura o SDK do .NET (altere '8.0.x' para a versão do seu projeto, ex: '9.0.x')
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 3. Restaura as dependências (NuGet)
    - name: Restore dependencies
      run: dotnet restore

    # 4. Compila o projeto garantindo que não vai re-restaurar
    - name: Build project
      run: dotnet build --no-restore --configuration Release

    # 5. Executa os testes unitários do projeto
    - name: Run tests
      run: dotnet test --no-build --verbosity normal --configuration Release
